<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FM</title>
        <style>
            .popup {
                position: fixed;
                inset: 0;

                display: flex;
                align-items: center;
                justify-content: center;

                background: rgb(0 0 0 / 50%);
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                z-index: 1000;
            }

            .popup-content {
                width: min(420px, calc(100vw - 32px));

                padding: 24px;

                background: white;
                border-radius: 12px;

                box-shadow: 0 20px 50px rgb(0 0 0 / 20%);
            }

            .popup-header {
                display: flex;
                align-items: center;
                justify-content: space-between;

                margin-bottom: 16px;
            }

            .popup-title {
                margin: 0;
            }

            .popup-close {
                border: 0;
                background: transparent;

                font-size: 24px;
                cursor: pointer;
            }

            .form-error-banner {
                margin-bottom: 16px;
                padding: 10px 12px;

                border: 1px solid #f5b5b5;
                border-radius: 6px;

                background: #fff1f1;
                color: #b42318;

                font-size: 14px;
                line-height: 1.4;
            }

            .form-field {
                display: flex;
                flex-direction: column;

                gap: 6px;
                margin-bottom: 16px;
            }

            .form-field label {
                font-size: 14px;
                font-weight: 500;
            }

            .form-field input,
            .form-field select {
                width: 100%;
                box-sizing: border-box;

                padding: 9px 10px;

                border: 1px solid #ccc;
                border-radius: 6px;

                font: inherit;
            }

            .form-field input:focus,
            .form-field select:focus {
                outline: none;
                border-color: #666;
            }

            .popup-actions {
                display: flex;
                justify-content: flex-end;

                gap: 8px;
                margin-top: 24px;
            }

            .popup-actions button {
                padding: 9px 14px;

                border: 1px solid #ccc;
                border-radius: 6px;

                background: white;

                cursor: pointer;
            }

            .popup-actions button[type="submit"] {
                border-color: #2563eb;
                background: #2563eb;
                color: white;
            }

            /* Financial Manager — Toast Manager */

            .fm-toast-container {
                /* Override these variables when the app palette is decided. */
                --fm-toast-success: var(--color-success, #15803d);
                --fm-toast-error: var(--color-danger, #b91c1c);
                --fm-toast-warning: var(--color-warning, #a16207);
                --fm-toast-info: var(--color-info, #1d4ed8);

                --fm-toast-surface: var(--color-surface, #ffffff);
                --fm-toast-text: var(--color-text, #1f2937);
                --fm-toast-muted: var(--color-text-muted, #6b7280);
                --fm-toast-border: var(--color-border, #e5e7eb);
                --fm-toast-shadow: 0 8px 28px rgb(0 0 0 / 12%);

                position: fixed;
                z-index: 1000;
                top: max(1rem, env(safe-area-inset-top));
                right: max(1rem, env(safe-area-inset-right));

                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;

                width: min(24rem, calc(100vw - 2rem));
                max-height: calc(100dvh - 2rem);
                overflow: visible;

                pointer-events: none;
                font-family: inherit;
                color: var(--fm-toast-text);
            }

            /* Base toast */

            .fm-toast {
                --fm-toast-accent: var(--fm-toast-info);
                --fm-toast-tint: color-mix(
                    in srgb,
                    var(--fm-toast-accent) 9%,
                    var(--fm-toast-surface)
                );

                display: grid;
                grid-template-columns: auto minmax(0, 1fr) auto;
                align-items: start;
                gap: 0.75rem;

                padding: 1rem;
                border: 1px solid var(--fm-toast-border);
                border-inline-start: 4px solid var(--fm-toast-accent);
                border-radius: 0.875rem;

                background: var(--fm-toast-surface);
                box-shadow: var(--fm-toast-shadow);
                color: var(--fm-toast-text);

                overflow-wrap: anywhere;
                pointer-events: auto;

                opacity: 0;
                transform: translateX(0.75rem) scale(0.98);
                transition:
                    opacity 180ms ease,
                    transform 180ms ease;
            }

            .fm-toast[data-state="visible"] {
                opacity: 1;
                transform: translateX(0) scale(1);
            }

            .fm-toast[data-state="leaving"] {
                opacity: 0;
                transform: translateX(0.5rem) scale(0.98);
                pointer-events: none;
            }

            /* Semantic types */

            .fm-toast--success {
                --fm-toast-accent: var(--fm-toast-success);
            }

            .fm-toast--error {
                --fm-toast-accent: var(--fm-toast-error);
            }

            .fm-toast--warning {
                --fm-toast-accent: var(--fm-toast-warning);
            }

            .fm-toast--info {
                --fm-toast-accent: var(--fm-toast-info);
            }

            /* Icon */

            .fm-toast__icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;

                width: 1.5rem;
                height: 1.5rem;
                margin-top: 0.0625rem;

                color: var(--fm-toast-accent);
            }

            .fm-toast__icon svg {
                display: block;
                width: 1.25rem;
                height: 1.25rem;
                flex: none;
            }

            /* Content */

            .fm-toast__content {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
                min-width: 0;
            }

            .fm-toast__title {
                font-size: 0.925rem;
                font-weight: 650;
                line-height: 1.4;
            }

            .fm-toast__title:empty {
                display: none;
            }

            .fm-toast__message {
                font-size: 0.875rem;
                line-height: 1.5;
                color: var(--fm-toast-muted);
            }

            /* Actions */

            .fm-toast__controls {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                flex-wrap: wrap;
                gap: 0.375rem;
            }

            .fm-toast__action,
            .fm-toast__close {
                display: inline-flex;
                align-items: center;
                justify-content: center;

                min-width: 2.5rem;
                min-height: 2.5rem;
                border: 0;
                border-radius: 0.5rem;

                font: inherit;
                cursor: pointer;
                transition:
                    background-color 150ms ease,
                    opacity 150ms ease;
            }

            .fm-toast__action {
                padding: 0.5rem 0.625rem;
                background: transparent;
                color: var(--fm-toast-accent);
                font-size: 0.875rem;
                font-weight: 650;
            }

            .fm-toast__action:hover:not(:disabled) {
                background: var(--fm-toast-tint);
            }

            .fm-toast__action:disabled {
                opacity: 0.55;
                cursor: wait;
            }

            .fm-toast__close {
                width: 2.5rem;
                padding: 0.5rem;
                background: transparent;
                color: var(--fm-toast-muted);
            }

            .fm-toast__close:hover {
                background: var(--fm-toast-tint);
                color: var(--fm-toast-text);
            }

            .fm-toast__close svg {
                display: block;
                width: 1rem;
                height: 1rem;
            }

            /* Keyboard accessibility */

            .fm-toast__action:focus-visible,
            .fm-toast__close:focus-visible {
                outline: 2px solid var(--fm-toast-accent);
                outline-offset: 2px;
            }

            /* Narrow screens */

            @media (max-width: 480px) {
                .fm-toast-container {
                    top: auto;
                    right: max(0.75rem, env(safe-area-inset-right));
                    bottom: max(0.75rem, env(safe-area-inset-bottom));
                    left: max(0.75rem, env(safe-area-inset-left));

                    width: auto;
                    max-height: calc(100dvh - 1.5rem);
                }

                .fm-toast {
                    gap: 0.625rem;
                    padding: 0.875rem;
                    border-radius: 0.75rem;
                }

                .fm-toast__controls {
                    gap: 0.125rem;
                }
            }

            /* Respect the user's motion preferences */

            @media (prefers-reduced-motion: reduce) {
                .fm-toast,
                .fm-toast__action,
                .fm-toast__close {
                    transition: none;
                }

                .fm-toast {
                    transform: none;
                }

                .fm-toast[data-state="visible"],
                .fm-toast[data-state="leaving"] {
                    transform: none;
                }
            }
        </style>
    </head>

    <body>
        <section>
            <h2>Goals</h2>
            <ul id="goals-list"></ul>
            <button id="create-goal-button">Create Goal</button>
        </section>
        <ul id="accounts-list"></ul>
        <section id="popup-container"></section>
        <button id="create-account-button">Create Account</button>
        <button id="create-transaction-button">Create Transaction</button>
        <button id="create-category-button">Create Category</button>

        <script type="module" src="src/app.ts"></script>
    </body>
</html>
